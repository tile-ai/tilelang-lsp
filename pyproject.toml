[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsp"
version = "0.2.0"
description = "TileLang LSP Server"
requires-python = ">=3.8"
dependencies = [
    "pygls>=2.0.0",
]

[project.scripts]
tlsp = "tlsp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tlsp*"]

[tool.ruff]
target-version = "py38"
line-length = 140
output-format = "full"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP", "FA",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
]
ignore = [
    # Module level import not at top of file
    "E402",
    # star imports
    "F405", "F403",
    # ambiguous name
    "E741",
    # line too long
    "E501",
    # if-else-block instead of ternary
    "SIM108",
    # key in dict.keys()
    "SIM118",
    # open file w.o. ctx manager
    "SIM115",
    # memory leaks
    "B019",
    # zip without explicit strict
    "B905",
    # No such file or directory
    "E902",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures intentionally contain broken code (e.g. undefined names).
"tests/fixtures/**.py" = ["F821"]

[tool.codespell]
skip = [".git", "node_modules", "out"]
