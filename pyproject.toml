[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsp"
version = "0.2.0"
description = "TileLang LSP Server"
requires-python = ">=3.8"
dependencies = [
    "pygls>=2.0.0",
]

[project.scripts]
tlsp = "tlsp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tlsp*"]
